plugins {
	// "fabric-loom-remap" is the Loom plugin for obfuscated Minecraft versions (<= 1.21.x)
	// that need Yarn/intermediary remapping.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and library repositories automatically.
	// Only add repositories here when depending on other mods.
}

loom {
	// src/main  -> common metadata/resources only (fabric.mod.json, assets)
	// src/client -> ALL Java code and client resources (mixins). Client classes may
	//               reference net.minecraft.client.*; the split enforces that at compile time.
	splitEnvironmentSourceSets()

	mods {
		"promptclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	// Loom attaches sourcesJar to remapSourcesJar and the "build" task automatically.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
